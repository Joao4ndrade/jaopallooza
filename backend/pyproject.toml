[project]
name = "jaopallooza-api"
version = "0.1.0"
description = "API do JAOPALLOOZA — o aniversário com cara de festival"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: Depends() em parâmetros é o padrão do FastAPI
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # aviso do Starlette sobre o cliente de testes; inofensivo
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff.lint.isort]
# a pasta ./alembic (migrations) não é um pacote nosso
known-third-party = ["alembic"]
