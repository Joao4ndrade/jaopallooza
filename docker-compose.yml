# Sobe tudo:          docker compose up --build   -> http://localhost:8080
# Só o banco (dev):   docker compose up -d db
# Configurações (admin, convite, SMTP...): crie um arquivo .env nesta pasta
# copiando o .env.example daqui. O Docker Compose lê ele sozinho.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jaopallooza
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jaopallooza"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/jaopallooza
      JWT_SECRET: ${JWT_SECRET:-dev-secret-troque-em-producao-por-favor-0000}
      ADMIN_NAMES: ${ADMIN_NAMES:-João}
      INVITE_CODE: ${INVITE_CODE:-}
      CORS_ORIGINS: http://localhost:8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      # E-mail (recuperação de senha). Sem SMTP_HOST, o link aparece em: docker compose logs api
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
