# Em produção o Caddy (HTTPS) fica na frente: repassa o protocolo original.
# Rodando local, sem Caddy, usa o protocolo desta própria conexão.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Fotos de perfil: o padrão do nginx (1 MB) barraria fotos maiores
    client_max_body_size 10m;

    # API: repassa para o container do FastAPI
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Arquivos com hash no nome: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota do React cai no index.html
    location / {
        try_files $uri /index.html;
    }
}
